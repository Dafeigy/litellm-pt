services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./relay.yaml:/app/relay.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
